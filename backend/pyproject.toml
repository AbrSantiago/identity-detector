[project]
name = "identity-detector-backend"
version = "0.1.0"
description = "Backend del detector de identidad (TP3 Seguridad): FastAPI, estado en memoria, correlación de fingerprint + red."
# Tope en <3.14: con 3.14 todavía no hay wheels de pydantic-core y uv intenta
# compilarlo desde Rust (falla sin el linker de MSVC). Fijamos 3.12 en
# .python-version; uv la descarga solo si no la tenés.
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "websockets==14.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

# No es un paquete distribuible, es una app: que uv no intente construirlo,
# solo que administre el entorno con las dependencias.
[tool.uv]
package = false

# Config de pytest acá mismo (antes vivía en pytest.ini).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
